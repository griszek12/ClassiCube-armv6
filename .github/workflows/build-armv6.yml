name: Build ClassiCube iOS (armv7, iOS 6+)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 15
        run: |
          sudo xcode-select -s /Applications/Xcode_15.0.1.app/Contents/Developer
          echo "XCODE_APP=Xcode_15.0.1.app" >> "$GITHUB_ENV"
          echo "IOS_SDK_VERSION=17.0" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Build iOS IPA
        run: make ios

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassiCube-armv7-ios6
          path: ClassiCube-iPhoneOS.ipa
          retention-days: 30
