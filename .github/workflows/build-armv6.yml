name: Build ClassiCube for ARMv6 (iOS 4.2.1)

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid zip

      - name: Build ARMv6 binary
        run: |
          cd misc/ios
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CC=$(xcrun --sdk iphoneos --find clang)
          mkdir -p build/ios/armv6 build/ios/ClassiCube-iPhoneOS.app
          CFLAGS="-arch armv6 -isysroot $SDK -miphoneos-version-min=7.0 -Os -fno-math-errno -fvisibility=hidden"
          LIBS="-framework Foundation -framework CoreFoundation -framework CoreGraphics -framework OpenGLES -framework UIKit -framework Security -framework CoreText -framework QuartzCore -lobjc"
          LDFLAGS="-arch armv6 -isysroot $SDK -miphoneos-version-min=7.0 -dead_strip"
          for f in $(find ../../src -maxdepth 1 -name "*.c") $(find ../../src/ios -name "*.c") $(find ../../third_party/bearssl -name "*.c"); do
            $CC $CFLAGS -c "$f" -o "build/ios/armv6/$(basename ${f%.c}.o)"
          done
          for f in $(find ../../src/ios -name "*.m"); do
            $CC $CFLAGS -c "$f" -o "build/ios/armv6/$(basename ${f%.m}.o)"
          done
          $CC $LDFLAGS build/ios/armv6/*.o $LIBS -o build/ios/ClassiCube-iPhoneOS.app/ClassiCube
          file build/ios/ClassiCube-iPhoneOS.app/ClassiCube

      - name: Package IPA
        run: |
          cd misc/ios
          cp Info.plist PkgInfo build/ios/ClassiCube-iPhoneOS.app/
          ldid -S build/ios/ClassiCube-iPhoneOS.app/ClassiCube
          rm -rf Payload && mkdir -p Payload
          cp -R build/ios/ClassiCube-iPhoneOS.app Payload/ClassiCube.app
          zip -r ClassiCube-armv6-ios4.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClassiCube-armv6-ios4
          path: misc/ios/ClassiCube-armv6-ios4.ipa
          retention-days: 30
